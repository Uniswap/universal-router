name: '[claude] Claude Code Review'

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, labeled, unlabeled]

jobs:
  claude-review-auto:
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.action != 'review_requested' &&
      !contains(github.head_ref, 'gh-readonly-queue/') &&
      !startsWith(github.head_ref, 'release/') &&
      (
        github.event.pull_request.draft == false ||
        github.event.action == 'ready_for_review'
      )

    uses: Uniswap/ai-toolkit/.github/workflows/_claude-code-review.yml@c4820d6e62a9488c831e722aac202733fafab5dd
    with:
      pr_number: ${{ github.event.pull_request.number }}
      base_ref: ${{ github.base_ref }}
      force_review: false
      toolkit_ref: c4820d6e62a9488c831e722aac202733fafab5dd
      custom_prompt_path: '.claude/prompts/claude-pr-review.md'
      model: 'claude-opus-5'

      # Standard timeout for most PRs
      timeout_minutes: 20

    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
